<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 绘图 · DeepNovis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #e5e5ea;
    --text: #1d1d1f;
    --sub: #6e6e73;
    --dim: #86868b;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 14px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    --transition: 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 顶栏（与图床统一） ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,245,247,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }
  .nav-group { display:flex; gap:4px; background:rgba(0,0,0,0.04); padding:3px; border-radius:8px; }
  .nav-tab {
    padding:5px 14px; border-radius:6px; font-size:13px; font-weight:500;
    text-decoration:none; transition:all .15s; color:var(--sub);
  }
  .nav-tab:hover { background:var(--surface); color:var(--text); }
  .nav-tab.active { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.1); }
  .badge {
    font-size:12px; color:var(--sub);
    background:rgba(0,0,0,0.04); padding:3px 10px; border-radius:20px;
  }

  /* ── 主内容 ── */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .page-title { font-size:28px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px; }
  .page-sub { font-size:14px; color:var(--sub); margin-bottom:32px; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--sub); margin-bottom: 16px;
  }

  /* ── Form ── */
  textarea, input, select {
    font-family: var(--font);
    font-size: 15px;
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  textarea:focus, input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
  }
  textarea { resize: vertical; min-height: 100px; }
  .form-group { margin-bottom: 16px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-label {
    display: block;
    font-size: 13px; font-weight: 500;
    color: var(--sub); margin-bottom: 6px;
  }
  .form-row { display: flex; gap: 12px; }
  .form-row > * { flex: 1; }

  /* ── Button ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    padding: 12px 24px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
    -webkit-user-select: none;
    user-select: none;
  }
  .btn-primary {
    background: var(--accent); color: #fff; width: 100%;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--border); font-size: 13px; padding: 8px 16px;
  }
  .btn-secondary:hover { background: rgba(0,113,227,0.05); }
  .btn-ghost {
    background: transparent; color: var(--sub);
    font-size: 13px; padding: 6px 10px; border-radius: 8px;
  }
  .btn-ghost:hover { background: rgba(0,0,0,0.04); }
  .btn-sm {
    padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-sm-blue { background: var(--accent); color: #fff; }
  .btn-sm-blue:hover { background: var(--accent-hover); }
  .btn-sm-ghost { background: rgba(0,0,0,0.06); color: var(--text); }
  .btn-sm-ghost:hover { background: rgba(0,0,0,0.10); }

  /* ── Spinner ── */
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Status ── */
  .status-banner {
    display: none; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: var(--radius-sm);
    font-size: 14px; margin-top: 16px;
  }
  .status-banner.show { display: flex; }
  .status-banner.success { background: #e8f8ee; color: #248a3d; }
  .status-banner.error { background: #fee8e6; color: #bf3a2b; }
  .status-banner.pending { background: #fff4e2; color: #b26200; }

  /* ── Result ── */
  .result-area { display: none; margin-top: 16px; }
  .result-area.show { display: block; }
  .result-area img {
    width: 100%; border-radius: var(--radius-sm);
    box-shadow: var(--shadow); display: block;
  }
  .result-actions {
    display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
  }
  .result-url {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bg);
    border-radius: 8px; font-size: 12px; color: var(--sub);
    flex: 1; min-width: 0; word-break: break-all;
  }

  /* ── History ── */
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-item {
    display: flex; gap: 12px; padding: 12px;
    border-radius: var(--radius-sm); background: var(--bg);
    transition: background var(--transition); cursor: pointer;
  }
  .history-item:hover { background: #eeeef0; }
  .history-thumb {
    width: 60px; height: 60px; flex-shrink: 0;
    border-radius: 8px; object-fit: cover; background: var(--border);
  }
  .history-info { flex: 1; min-width: 0; }
  .history-prompt {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .history-meta { font-size: 12px; color: var(--dim); }
  .history-empty {
    text-align: center; padding: 24px;
    color: var(--dim); font-size: 14px;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(29,29,31,0.92); color: #fff;
    padding: 10px 20px; border-radius: 10px;
    font-size: 13px; opacity: 0;
    transition: all 0.3s ease; pointer-events: none;
    backdrop-filter: blur(8px); z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Key 状态提示 ── */
  .key-status {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
  }
  .key-status + .key-status { border-top: 1px solid var(--border); }
  .key-label { font-size: 14px; }
  .key-hint { font-size: 12px; color: var(--dim); }
  .key-indicator { font-size: 12px; font-weight: 500; }

  /* ── 参考图上传区 ── */
  .ref-section { margin-bottom: 16px; }
  .ref-section:last-child { margin-bottom: 0; }
  .ref-label-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .ref-upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    background: var(--bg);
    margin-bottom: 10px;
    position: relative;
  }
  .ref-upload-zone:hover { border-color: var(--accent); background: rgba(0,113,227,0.03); }
  .ref-upload-zone.dragover { border-color: var(--accent); background: rgba(0,113,227,0.06); }
  .ref-upload-zone .icon { font-size: 20px; color: var(--dim); margin-bottom: 4px; }
  .ref-upload-zone .text { font-size: 12px; color: var(--dim); }
  .ref-upload-zone .hint { font-size: 11px; color: var(--dim); margin-top: 2px; opacity: 0.6; }
  #refUploadInput { display: none; }

  /* 参考图列表 */
  .ref-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .ref-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--sub);
  }
  .ref-chip-thumb {
    width: 28px; height: 28px; border-radius: 6px;
    object-fit: cover; background: var(--border); flex-shrink: 0;
  }
  .ref-chip-name {
    max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ref-chip-remove {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 14px; padding: 0 2px; line-height: 1;
  }
  .ref-chip-remove:hover { color: var(--red); }
  .ref-empty { font-size: 12px; color: var(--dim); font-style: italic; padding: 2px 0; }

  /* 粘贴 URL 行 */
  .ref-paste-row {
    display: flex; gap: 6px; align-items: center;
  }
  .ref-paste-row input { flex: 1; font-size: 13px; padding: 8px 10px; }
  .ref-paste-btn {
    padding: 8px 14px; font-size: 13px; font-weight: 500;
    background: transparent; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--accent);
    cursor: pointer; transition: all var(--transition);
    white-space: nowrap;
  }
  .ref-paste-btn:hover { background: rgba(0,113,227,0.05); }

  @media (max-width: 600px) {
    .container { padding: 20px 16px 60px; }
    .card { padding: 20px; }
    header { padding: 0 16px; }
    .page-title { font-size: 24px; }
    .form-row { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- 顶栏（与图床统一） -->
<header>
  <nav style="display:flex;align-items:center;gap:20px;">
    <div class="logo">Deep<span>Novis</span></div>
    <div class="nav-group">
      <a href="/" class="nav-tab"><i class="fa-regular fa-image" style="margin-right:3px;"></i>图床</a>
      <a href="/prompt-editor" class="nav-tab active"><i class="fa-solid fa-wand-magic-sparkles" style="margin-right:3px;"></i>AI绘图</a>
    </div>
  </nav>
  <div style="display:flex;gap:12px;align-items:center;">
    <span class="badge">GPT-Image-2 · 0.1元/张</span>
  </div>
</header>

<div class="container">

  <div class="page-title">GPT-Image-2</div>
  <div class="page-sub">基于速创 API 的 AI 生图工具</div>

  <!-- 生图区 -->
  <div class="card">
    <div class="card-title"><i class="fa-regular fa-pen-to-square" style="margin-right:4px;"></i>生图</div>

    <div class="form-group">
      <label class="form-label" for="prompt">提示词</label>
      <textarea id="prompt" placeholder="描述你想生成的图片…" rows="4"></textarea>
    </div>

    <div class="form-row form-group">
      <div>
        <label class="form-label">图片比例</label>
        <select id="size">
          <option value="auto">自动 auto</option>
          <option value="1:1">正方形 1:1</option>
          <option value="16:9">横屏 16:9</option>
          <option value="9:16">竖屏 9:16</option>
          <option value="4:3">横屏 4:3</option>
          <option value="3:4">竖屏 3:4</option>
          <option value="3:2">横屏 3:2</option>
          <option value="2:3">竖屏 2:3</option>
          <option value="21:9">超宽 21:9</option>
          <option value="9:21">超长 9:21</option>
        </select>
      </div>
      <div>
        <label class="form-label">参考图 <span style="font-weight:400;color:var(--dim)">(可选)</span></label>
        <div style="font-size:12px;color:var(--dim);margin-bottom:8px;">上传或粘贴图片链接作为参考</div>
      </div>
    </div>

    <!-- 参考图管理 -->
    <div class="ref-section form-group">
      <div class="ref-upload-zone" id="refDropZone">
        <div class="icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="text">拖拽图片到此处，或点击选择</div>
        <div class="hint">支持 JPG / PNG / WebP / GIF</div>
        <input type="file" id="refUploadInput" accept="image/*" multiple />
      </div>
      <div class="ref-paste-row">
        <input type="url" id="refPasteInput" placeholder="或粘贴图片 URL，按回车添加" />
        <button class="ref-paste-btn" id="refPasteBtn"><i class="fa-regular fa-plus"></i> 添加</button>
      </div>
      <div class="ref-list" id="refList">
        <span class="ref-empty">暂无参考图</span>
      </div>
    </div>

    <button class="btn btn-primary" id="genBtn">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span id="genBtnText">生成图片</span>
    </button>

    <!-- 状态 -->
    <div class="status-banner" id="statusBanner">
      <i class="fa-solid" id="statusIcon"></i>
      <span id="statusText"></span>
    </div>

    <!-- 结果 -->
    <div class="result-area" id="resultArea">
      <img id="resultImg" alt="生成结果" />
      <div class="result-actions">
        <span class="result-url" id="resultUrl"></span>
        <button class="btn-secondary" id="copyBtn" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px;">
          <i class="fa-regular fa-copy"></i> 复制
        </button>
        <button class="btn-secondary" id="downloadBtn" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px;">
          <i class="fa-solid fa-download"></i> 下载
        </button>
      </div>
    </div>
  </div>

  <!-- 配置状态 -->
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-sliders" style="margin-right:4px;"></i>配置</div>
    <div class="key-status" id="keyConfigRow">
      <div>
        <div class="key-label">API Key</div>
        <div class="key-hint" id="keyHintText">服务端已配置，无需前端设置</div>
      </div>
      <span class="key-indicator" id="keyIndicator">检测中…</span>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span><i class="fa-regular fa-clock"></i> 历史记录</span>
      <button class="btn-ghost" id="clearHistoryBtn" style="font-size:12px;color:var(--red);border:none;cursor:pointer;">清空</button>
    </div>
    <div id="historyList" class="history-list">
      <div class="history-empty">暂无记录</div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
;(() => {
  'use strict'

  // ── DOM ──
  const $ = (s, p = document) => p.querySelector(s)
  const promptEl = $('#prompt')
  const sizeEl = $('#size')
  const genBtn = $('#genBtn')
  const genBtnText = $('#genBtnText')
  const statusBanner = $('#statusBanner')
  const statusIcon = $('#statusIcon')
  const statusText = $('#statusText')
  const resultArea = $('#resultArea')
  const resultImg = $('#resultImg')
  const resultUrl = $('#resultUrl')
  const copyBtn = $('#copyBtn')
  const downloadBtn = $('#downloadBtn')
  const historyList = $('#historyList')
  const clearHistoryBtn = $('#clearHistoryBtn')
  const keyIndicator = $('#keyIndicator')
  const toast = $('#toast')

  // ── 状态 ──
  let polling = false
  let pollTimer = null
  let currentResult = null
  let refImages = [] // { url, name } 参考图列表

  // ── 历史 ──
  function getHistory() {
    try { return JSON.parse(localStorage.getItem('deepnovis_ai_history')||'[]') } catch { return [] }
  }
  function saveHistory(h) { localStorage.setItem('deepnovis_ai_history', JSON.stringify(h.slice(0,50))) }
  function addHistory(prompt, size, imgUrl) {
    const h = getHistory(); h.unshift({ prompt, size, imgUrl, time: Date.now() }); saveHistory(h); renderHistory()
  }
  function renderHistory() {
    const h = getHistory()
    if (!h.length) { historyList.innerHTML = '<div class="history-empty">暂无记录</div>'; return }
    historyList.innerHTML = h.map((item, i) => `
      <div class="history-item" data-index="${i}" data-url="${item.imgUrl}">
        <img class="history-thumb" src="${item.imgUrl}" alt="" loading="lazy" />
        <div class="history-info">
          <div class="history-prompt">${escHtml(item.prompt)}</div>
          <div class="history-meta">${item.size||'auto'} · ${fmtTime(item.time)}</div>
        </div>
      </div>
    `).join('')
    historyList.querySelectorAll('.history-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.index); const item = getHistory()[idx]
        if (item) {
          showResult(item.imgUrl); promptEl.value = item.prompt; sizeEl.value = item.size||'auto'
        }
      })
    })
  }
  function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML }
  function fmtTime(ts) {
    return new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
  }

  // ── Toast ──
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show')
    clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000)
  }

  // ── Status ──
  function setStatus(type, text, icon) {
    statusBanner.className = 'status-banner show ' + type
    statusIcon.className = 'fa-solid ' + (icon || '')
    statusText.textContent = text
  }
  function hideStatus() { statusBanner.className = 'status-banner' }

  // ── Result ──
  function showResult(url) {
    currentResult = url; resultArea.classList.add('show')
    resultImg.src = url; resultUrl.textContent = url
    hideStatus(); genBtn.disabled = false; genBtnText.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> 生成图片'
  }
  function hideResult() { resultArea.classList.remove('show'); currentResult = null }

  // ── 参考图管理 ──
  function renderRefList() {
    const list = $('#refList')
    if (!refImages.length) {
      list.innerHTML = '<span class="ref-empty">暂无参考图</span>'
      return
    }
    list.innerHTML = refImages.map((img, i) => `
      <div class="ref-chip">
        <img class="ref-chip-thumb" src="${img.url}" alt="" />
        <span class="ref-chip-name">${img.name}</span>
        <button class="ref-chip-remove" onclick="removeRef(${i})">&times;</button>
      </div>
    `).join('')
  }
  // 暴露给内联 onclick
  window.removeRef = function(i) { refImages.splice(i, 1); renderRefList() }

  // 上传
  const refDropZone = $('#refDropZone')
  const refUploadInput = $('#refUploadInput')

  refDropZone.addEventListener('dragover', e => { e.preventDefault(); refDropZone.classList.add('dragover') })
  refDropZone.addEventListener('dragleave', () => refDropZone.classList.remove('dragover'))
  refDropZone.addEventListener('drop', e => {
    e.preventDefault(); refDropZone.classList.remove('dragover')
    handleRefFiles([...e.dataTransfer.files])
  })
  refDropZone.addEventListener('click', () => refUploadInput.click())
  refUploadInput.addEventListener('change', e => {
    handleRefFiles([...e.target.files])
    e.target.value = ''
  })

  function handleRefFiles(files) {
    const imgs = files.filter(f => f.type.startsWith('image/'))
    if (!imgs.length) { showToast('请选择图片文件'); return }
    imgs.forEach(uploadRefFile)
  }

  async function uploadRefFile(file) {
    const fd = new FormData()
    fd.append('file', file)
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: fd })
      const data = await res.json()
      if (!res.ok) throw new Error(data.detail || '上传失败')
      refImages.push({ url: data.url, name: file.name })
      renderRefList()
      showToast('已添加参考图: ' + file.name)
    } catch (e) {
      showToast('上传失败: ' + e.message)
    }
  }

  // 粘贴 URL
  const refPasteInput = $('#refPasteInput')
  const refPasteBtn = $('#refPasteBtn')

  function addRefUrl() {
    const url = refPasteInput.value.trim()
    if (!url) return
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      showToast('请输入有效的图片 URL'); return
    }
    // 去重
    if (refImages.some(r => r.url === url)) { showToast('该 URL 已存在'); refPasteInput.value = ''; return }
    const name = url.split('/').pop() || '参考图'
    refImages.push({ url, name: name.slice(0, 30) })
    renderRefList()
    refPasteInput.value = ''
    showToast('已添加参考图')
  }

  refPasteBtn.addEventListener('click', addRefUrl)
  refPasteInput.addEventListener('keydown', e => { if (e.key === 'Enter') addRefUrl() })

  // ── 复制 ──
  copyBtn.addEventListener('click', async () => {
    if (!currentResult) return
    try { await navigator.clipboard.writeText(currentResult); showToast('已复制图片 URL') }
    catch {
      const ta=document.createElement('textarea'); ta.value=currentResult
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove()
      showToast('已复制图片 URL')
    }
  })

  // ── 下载 ──
  downloadBtn.addEventListener('click', () => {
    if (!currentResult) return
    const a=document.createElement('a'); a.href=currentResult
    a.download='gpt-image2-'+Date.now()+'.png'; a.target='_blank'; a.click()
  })

  // ── 检查服务端 API Key 状态 ──
  async function fetchKeyStatus() {
    try {
      const r=await fetch('/api/gpt/status'); const d=await r.json()
      if (d.ready) {
        keyIndicator.textContent = '✓ ' + d.keyHint; keyIndicator.style.color = 'var(--green)'
      } else {
        keyIndicator.textContent = '⚠️ 未配置'; keyIndicator.style.color = 'var(--red)'
      }
    } catch {
      keyIndicator.textContent = '无法连接服务'; keyIndicator.style.color = 'var(--red)'
    }
  }
  fetchKeyStatus()

  // ── 生成 ──
  genBtn.addEventListener('click', async () => {
    const prompt = promptEl.value.trim()
    if (!prompt) { showToast('请输入提示词'); promptEl.focus(); return }

    const urls = refImages.map(r => r.url).filter(u => u)

    hideResult()
    genBtn.disabled = true
    genBtnText.innerHTML = '<span class="spinner"></span> 提交中…'
    setStatus('pending', '正在提交任务…', 'fa-circle-notch fa-spin')

    try {
      // 1️⃣ 提交
      const r1 = await fetch('/api/gpt/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, size: sizeEl.value, urls })
      })
      const d1 = await r1.json()
      if (!r1.ok) throw new Error(d1.detail || d1.msg || '提交失败')
      if (d1.code !== 200 || !d1.data?.id) throw new Error(d1.msg || '提交失败')

      const taskId = d1.data.id
      setStatus('pending', '任务已提交，正在生成…（约 15-30 秒）', 'fa-circle-notch fa-spin')
      genBtnText.innerHTML = '<span class="spinner"></span> 生成中…'
      polling = true

      // 2️⃣ 轮询
      const poll = async () => {
        try {
          const r2 = await fetch('/api/gpt/result/' + encodeURIComponent(taskId))
          const d2 = await r2.json()

          if (d2.code === 1 && d2.data) {
            // 成功
            showResult(d2.data)
            addHistory(prompt, sizeEl.value, d2.data)
            polling = false
            return
          }

          if (d2.code === 2) {
            throw new Error(d2.msg || '生成失败')
          }

          // 处理中，继续轮询
          pollTimer = setTimeout(poll, 2000)
        } catch (e) {
          setStatus('error', '查询出错: ' + e.message, 'fa-circle-exclamation')
          genBtn.disabled = false
          genBtnText.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> 重新生成'
          polling = false
        }
      }

      poll()
    } catch (e) {
      setStatus('error', e.message, 'fa-circle-exclamation')
      genBtn.disabled = false
      genBtnText.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> 重新生成'
    }
  })

  // ── 清空历史 ──
  clearHistoryBtn.addEventListener('click', () => {
    if (confirm('确定清空所有历史记录？')) { localStorage.removeItem('deepnovis_ai_history'); renderHistory() }
  })

  // ── 停止轮询 ──
  window.addEventListener('beforeunload', () => { if (pollTimer) clearTimeout(pollTimer) })

  // ── 初始化 ──
  renderHistory()
})()
</script>
</body>
</html>
