<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>图床 · ImgHost</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #e0e0e5;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --text: #1d1d1f;
    --sub: #6e6e73;
    --toast-bg: #1d1d1f;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.13);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: var(--text);
  }

  /* ── 顶栏 ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,245,247,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }
  .nav-group { display:flex; gap:4px; background:rgba(0,0,0,0.04); padding:3px; border-radius:8px; }
  .nav-tab { padding:5px 14px; border-radius:6px; font-size:13px; font-weight:500; text-decoration:none; transition:all .15s; color:var(--sub); }
  .nav-tab:hover { background:var(--card); color:var(--text); }
  .nav-tab.active { background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.1); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .btn-sm { padding:8px 18px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .15s; }
  .btn-sm-blue { background:var(--accent); color:#fff; }
  .btn-sm-blue:hover { background:var(--accent-hover); }
  .user-btn {
    display:flex;align-items:center;gap:8px;
    padding:4px 10px 4px 4px;border-radius:20px;
    background:var(--card);border:1px solid var(--border);
    cursor:pointer;font-size:13px;font-weight:500;
    transition:all .15s;color:var(--text);
  }
  .user-btn:hover { border-color:var(--accent); }
  .user-avatar {
    width:28px;height:28px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;
  }
  .user-menu {
    display:none;position:absolute;top:44px;right:0;z-index:100;
    background:var(--card);border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.12);
    border:1px solid var(--border);min-width:160px;overflow:hidden;
  }
  .user-menu.show { display:block; }
  .user-menu-item {
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;font-size:13px;cursor:pointer;
    transition:background .1s;color:var(--text);
  }
  .user-menu-item:hover { background:var(--bg); }
  .user-menu-item.danger { color:#ff453a; }
  .user-menu-divider { height:1px;background:var(--border);margin:4px 0; }
  .modal-overlay {
    display:none;position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    align-items:center;justify-content:center;
  }
  .modal-overlay.show { display:flex; }
  .modal-box {
    background:var(--card);border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,0.15);
    padding:32px;width:360px;max-width:90vw;
    animation:modalIn 0.2s ease;
  }
  @keyframes modalIn { from{opacity:0;transform:scale(0.95) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .modal-box h2 { font-size:20px;font-weight:700;margin-bottom:4px; }
  .modal-box .modal-sub { font-size:13px;color:var(--sub);margin-bottom:24px; }
  .modal-box input {
    font-family:inherit;font-size:15px;width:100%;
    border:1.5px solid var(--border);border-radius:10px;
    padding:12px 14px;background:var(--card);color:var(--text);
    outline:none;transition:border-color .25s;
  }
  .modal-box input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.15); }
  .modal-box .form-group { margin-bottom:14px; }
  .modal-box .form-group:last-of-type { margin-bottom:20px; }
  .modal-box .auth-error { display:none;font-size:13px;color:#ff453a;background:#fee8e6;padding:8px 12px;border-radius:8px;margin-bottom:14px; }
  .modal-box .auth-error.show { display:block; }
  .modal-box .auth-switch { text-align:center;margin-top:16px;font-size:13px;color:var(--sub); }
  .modal-box .auth-switch a { color:var(--accent);cursor:pointer;text-decoration:none; }
  .badge {
    font-size: 12px; color: var(--sub);
    background: rgba(0,0,0,0.05);
    padding: 3px 10px; border-radius: 20px;
  }

  /* ── 主区域 ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── 上传区 ── */
  #drop-zone {
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 56px 32px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(0,113,227,0.04);
    transform: scale(1.005);
    box-shadow: var(--shadow-hover);
  }
  .drop-icon {
    width: 64px; height: 64px;
    background: linear-gradient(145deg, #e8f0fe, #d2e3fc);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 26px;
    color: var(--accent);
    transition: transform .2s;
  }
  #drop-zone:hover .drop-icon { transform: translateY(-3px); }
  .drop-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .drop-sub { font-size: 14px; color: var(--sub); margin-bottom: 24px; }
  .btn-upload {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent);
    color: #fff;
    padding: 10px 24px;
    border-radius: 980px;
    font-size: 14px; font-weight: 500;
    border: none; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-upload:hover { background: var(--accent-hover); }
  .btn-upload:active { transform: scale(0.97); }
  #file-input { display: none; }

  /* ── 进度区 ── */
  #progress-area { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .prog-item {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px;
  }
  .prog-thumb {
    width: 40px; height: 40px; border-radius: 8px;
    object-fit: cover; background: var(--border); flex-shrink: 0;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--sub);
  }
  .prog-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .prog-info { flex: 1; min-width: 0; }
  .prog-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .prog-bar {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #34aadc);
    width: 0%;
    transition: width .3s ease;
    position: relative;
    overflow: hidden;
  }
  .prog-bar.shimmer::after {
    content: '';
    position: absolute; top: 0; left: -60%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { to { left: 160%; } }
  .prog-status { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .prog-action { flex-shrink: 0; }
  .btn-copy-sm {
    background: rgba(0,113,227,0.08);
    color: var(--accent);
    border: none; cursor: pointer;
    padding: 6px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
    transition: background .15s;
    white-space: nowrap;
  }
  .btn-copy-sm:hover { background: rgba(0,113,227,0.15); }
  .prog-done-icon { color: #34c759; font-size: 18px; }
  .prog-error-icon { color: #ff3b30; font-size: 18px; }

  /* ── 分隔 ── */
  .section-title {
    font-size: 20px; font-weight: 600; margin: 40px 0 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title .count {
    font-size: 12px; font-weight: 500; color: var(--sub);
    background: rgba(0,0,0,0.06); padding: 2px 8px; border-radius: 20px;
  }
  .refresh-btn {
    margin-left: auto;
    background: none; border: 1px solid var(--border);
    padding: 5px 14px; border-radius: 8px;
    font-size: 12px; color: var(--sub); cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .refresh-btn:hover { background: var(--card); color: var(--text); }

  /* ── 图片网格 ── */
  #image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .img-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
    cursor: pointer;
    position: relative;
    group: true;
  }
  .img-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .img-card img {
    width: 100%; aspect-ratio: 1;
    object-fit: cover; display: block;
    background: var(--border);
  }
  .img-card-info {
    padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .img-name { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .img-actions { display: flex; gap: 6px; }
  .img-btn {
    background: none; border: none; cursor: pointer;
    color: var(--sub); font-size: 13px;
    padding: 4px 6px; border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .img-btn:hover { color: var(--accent); background: rgba(0,113,227,0.08); }
  .img-btn.del:hover { color: #ff3b30; background: rgba(255,59,48,0.08); }
  .img-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s;
    font-size: 22px; color: #fff; gap: 16px;
  }
  .img-card:hover .img-overlay { opacity: 1; }
  .overlay-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 8px 16px; border-radius: 8px;
    font-size: 13px; cursor: pointer; backdrop-filter: blur(4px);
    transition: background .15s;
  }
  .overlay-btn:hover { background: rgba(255,255,255,0.35); }
  .overlay-del:hover { background: rgba(255,59,48,0.5); border-color: rgba(255,59,48,0.6); }

  /* ── 空状态 ── */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--sub);
  }
  .empty-state i { font-size: 48px; opacity: 0.2; margin-bottom: 16px; display: block; }

  /* ── Toast ── */
  #toast-container {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 9999; pointer-events: none;
  }
  .toast {
    background: var(--toast-bg); color: #fff;
    padding: 10px 20px; border-radius: 980px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    animation: toastIn .25s ease forwards;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.success i { color: #34c759; }
  .toast.error i { color: #ff3b30; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(8px) scale(0.95); }
  }
  .toast.out { animation: toastOut .2s ease forwards; }

  /* ── 格式切换 ── */
  .format-tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.05); padding: 3px; border-radius: 8px; }
  .fmt-tab {
    padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: none; background: none; color: var(--sub); transition: all .15s;
  }
  .fmt-tab.active { background: var(--card); color: var(--text); font-weight: 500; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  /* ── 弹窗 ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; transition: opacity .2s;
  }
  .modal-backdrop.show { opacity: 1; }
  .modal {
    background: var(--card); border-radius: 18px;
    padding: 24px; max-width: 480px; width: 90%;
    box-shadow: 0 24px 64px rgba(0,0,0,0.18);
    transform: scale(0.95); transition: transform .2s;
  }
  .modal-backdrop.show .modal { transform: scale(1); }
  .modal img { width: 100%; border-radius: 10px; margin: 12px 0; object-fit: contain; max-height: 300px; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .url-box {
    background: var(--bg); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: var(--sub);
    word-break: break-all; margin: 6px 0;
    border: 1px solid var(--border);
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .btn-sm {
    padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: rgba(0,0,0,0.06); color: var(--text); }
  .btn-ghost:hover { background: rgba(0,0,0,0.10); }
  .loading-spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <nav style="display:flex;align-items:center;gap:20px;">
    <div class="logo">Deep<span>Novis</span></div>
    <div class="nav-group">
      <a href="/" class="nav-tab active"><i class="fa-regular fa-image" style="margin-right:3px;"></i>图床</a>
      <a href="/prompt-editor" class="nav-tab"><i class="fa-solid fa-wand-magic-sparkles" style="margin-right:3px;"></i>AI绘图</a>
    </div>
  </nav>
  <div class="header-right">
    <div class="format-tabs" id="format-tabs">
      <button class="fmt-tab active" data-fmt="url">URL</button>
      <button class="fmt-tab" data-fmt="markdown">Markdown</button>
      <button class="fmt-tab" data-fmt="html">HTML</button>
    </div>
    <div id="authArea">
      <button class="btn-sm btn-sm-blue" id="headerLoginBtn" style="display:none;"><i class="fa-regular fa-circle-user"></i> 登录</button>
      <div id="userArea" style="display:none;position:relative;">
        <button class="user-btn" id="userBtn">
          <span class="user-avatar" id="userAvatar">U</span>
          <span id="userName">用户</span>
          <i class="fa-solid fa-chevron-down" style="font-size:10px;color:var(--sub);"></i>
        </button>
        <div class="user-menu" id="userMenu">
          <div class="user-menu-item"><i class="fa-regular fa-user"></i> <span id="menuUserName">用户</span></div>
          <div class="user-menu-divider"></div>
          <div class="user-menu-item" id="apiSettingsBtn"><i class="fa-solid fa-key"></i> API 设置</div>
          <div class="user-menu-divider"></div>
          <div class="user-menu-item danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- 上传区 -->
  <div id="drop-zone">
    <div class="drop-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
    <div class="drop-title">拖拽图片到此处</div>
    <div class="drop-sub">支持 JPG、PNG、GIF、WebP、SVG，可多选</div>
    <button class="btn-upload" onclick="document.getElementById('file-input').click()">
      <i class="fa-solid fa-plus"></i> 选择文件
    </button>
    <input type="file" id="file-input" multiple accept="image/*"/>
  </div>

  <!-- 上传进度 -->
  <div id="progress-area"></div>

  <!-- 历史列表 -->
  <div class="section-title">
    已上传图片
    <span class="count" id="img-count">0</span>
    <button class="refresh-btn" onclick="loadImages()">
      <i class="fa-solid fa-rotate-right"></i> 刷新
    </button>
  </div>
  <div id="image-grid"></div>
</main>

<!-- Auth Modal -->
<div class="modal-overlay" id="authModal">
  <div class="modal-box" style="width:380px;">
    <div style="display:flex;gap:0;background:rgba(0,0,0,0.05);padding:3px;border-radius:10px;margin-bottom:20px;">
      <button class="auth-tab active" id="authTabLogin" style="flex:1;padding:7px 0;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.1);">登录</button>
      <button class="auth-tab" id="authTabRegister" style="flex:1;padding:7px 0;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:var(--sub);">注册</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- 登录表单 -->
    <div id="loginForm">
      <div class="form-group">
        <input type="email" id="loginEmail" placeholder="邮箱地址" autocomplete="email" />
      </div>
      <div class="form-group">
        <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" />
      </div>
      <button class="btn-upload" id="loginBtn" style="width:100%;justify-content:center;border-radius:12px;">
        <span id="loginBtnText">登录</span>
      </button>
    </div>

    <!-- 注册表单 -->
    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <input type="email" id="regEmail" placeholder="邮箱地址" autocomplete="email" />
      </div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="regCode" placeholder="验证码" maxlength="8" style="flex:1;font-family:inherit;font-size:15px;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card);color:var(--text);outline:none;transition:border-color .25s;letter-spacing:4px;text-align:center;font-weight:600;" />
        <button id="regSendCodeBtn" style="padding:12px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s;">获取验证码</button>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <input type="password" id="regPassword" placeholder="设置密码（8位以上，含字母+数字）" autocomplete="new-password" />
      </div>
      <button class="btn-upload" id="registerBtn" style="width:100%;justify-content:center;border-radius:12px;">
        <span id="registerBtnText">注册</span>
      </button>
    </div>

    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--sub);">
      登录即表示同意 <a style="color:var(--accent);text-decoration:none;">服务条款</a>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(29,29,31,0.92);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all 0.3s ease;pointer-events:none;backdrop-filter:blur(8px);z-index:999;"></div>

<!-- Toast -->
<div id="toast-container"></div>

<!-- 预览弹窗 -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-inner">
    <div class="modal-title" id="modal-title">图片详情</div>
    <img id="modal-img" src="" alt=""/>
    <div style="display:flex;gap:6px;margin-bottom:4px;">
      <span style="font-size:12px;color:var(--sub);">链接</span>
      <div class="format-tabs" id="modal-fmt-tabs" style="margin-left:auto;">
        <button class="fmt-tab active" data-fmt="url">URL</button>
        <button class="fmt-tab" data-fmt="markdown">Markdown</button>
        <button class="fmt-tab" data-fmt="html">HTML</button>
      </div>
    </div>
    <div class="url-box" id="modal-url"></div>
    <div class="modal-actions">
      <button class="btn-sm btn-ghost" onclick="closeModal()">关闭</button>
      <button class="btn-sm btn-primary" onclick="copyModalUrl()"><i class="fa-solid fa-copy"></i> 复制</button>
    </div>
  </div>
</div>

<!-- API 设置弹窗 -->
<div class="modal-overlay" id="apiSettingsModal">
  <div class="modal-box">
    <h2>API 设置</h2>
    <div class="modal-sub">配置你的 API Key，仅保存在服务端</div>
    <div class="auth-error" id="apiSettingsError"></div>
    <div class="form-group">
      <input type="password" id="apiKeyInput" placeholder="输入 API Key" />
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-upload" id="apiSettingsSaveBtn" style="flex:2;justify-content:center;border-radius:12px;">
        <span id="apiSettingsSaveText">保存</span>
      </button>
      <button class="btn-upload" id="apiSettingsCancelBtn" style="flex:1;justify-content:center;border-radius:12px;background:#e0e0e5;color:var(--text);">取消</button>
    </div>
  </div>
</div>

<script>
// ── 状态 ────────────────────────────────────────────────────────────────
let copyFormat = 'url';
let modalData = null;
let modalFmt  = 'url';

// ── 工具 ────────────────────────────────────────────────────────────────
function getLink(item, fmt) {
  if (fmt === 'markdown') return `![${item.filename}](${item.url})`;
  if (fmt === 'html')     return `<img src="${item.url}" alt="${item.filename}"/>`;
  return item.url;
}

// 将 GitHub raw URL 转为 proxy URL（国内可直接访问）
function getProxyUrl(url) {
  if (!url) return url;
  // https://raw.githubusercontent.com/{owner}/{repo}/main/assets/{path}
  const match = url.match(/raw\.githubusercontent\.com\/[^/]+\/[^/]+\/main\/assets\/(.+)/);
  if (match) return '/api/proxy/assets/' + match[1];
  return url;
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-circle-xmark'}"></i> ${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  }, 2200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('链接已复制');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('链接已复制');
  }
}

function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML }

// ── 格式切换 ─────────────────────────────────────────────────────────────
document.getElementById('format-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.fmt-tab');
  if (!btn) return;
  document.querySelectorAll('#format-tabs .fmt-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  copyFormat = btn.dataset.fmt;
});

// ── 拖拽上传 ─────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  handleFiles([...e.dataTransfer.files]);
});
document.getElementById('file-input').addEventListener('change', e => {
  handleFiles([...e.target.files]);
  e.target.value = '';
});

// ── 上传逻辑 ─────────────────────────────────────────────────────────────
function handleFiles(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) { toast('请上传图片文件', 'error'); return; }
  imgs.forEach(uploadFile);
}

function createProgItem(file) {
  const reader = new FileReader();
  const item = document.createElement('div');
  item.className = 'prog-item';
  item.innerHTML = `
    <div class="prog-thumb prog-thumb-${Date.now()}">
      <i class="fa-regular fa-image"></i>
    </div>
    <div class="prog-info">
      <div class="prog-name">${escHtml(file.name)}</div>
      <div class="prog-bar-wrap"><div class="prog-bar shimmer" style="width:5%"></div></div>
      <div class="prog-status">准备上传…</div>
    </div>
    <div class="prog-action"></div>
  `;
  document.getElementById('progress-area').prepend(item);
  const thumbEl = item.querySelector('.prog-thumb');
  const barEl = item.querySelector('.prog-bar');
  const statusEl = item.querySelector('.prog-status');
  const actionEl = item.querySelector('.prog-action');
  // 挂载到 DOM 上方便后续引用
  item._bar = barEl; item._status = statusEl; item._action = actionEl;
  reader.onload = e => {
    if (thumbEl) thumbEl.innerHTML = `<img src="${e.target.result}"/>`;
  };
  reader.readAsDataURL(file);
  return item;
}

async function uploadFile(file) {
  const item = createProgItem(file);
  const bar = item._bar;
  const status = item._status;
  const action = item._action;

  // 模拟进度
  let pct = 5;
  const tick = setInterval(() => {
    pct = Math.min(pct + Math.random() * 15, 85);
    if (bar) bar.style.width = pct + '%';
  }, 200);

  const fd = new FormData();
  fd.append('file', file);

  try {
    const res  = await fetch('/api/upload', { method: 'POST', body: fd, headers: { 'Authorization': 'Bearer ' + authToken } });
    const data = await res.json();
    clearInterval(tick);

    if (!res.ok) throw new Error(data.detail || '上传失败');

    if (bar) { bar.style.width = '100%'; bar.classList.remove('shimmer'); }
    if (status) status.textContent = '上传成功';
    if (action) {
      action.innerHTML = `<button class="btn-copy-sm" onclick="copyText('${data.url}')">复制链接</button>`;
    }
    toast(`${file.name} 上传成功`);
    loadImages();
  } catch (err) {
    clearInterval(tick);
    if (bar) { bar.style.width = '100%'; bar.style.background = '#ff3b30'; bar.classList.remove('shimmer'); }
    if (status) status.textContent = err.message.includes('401') ? '请先登录' : '上传失败: ' + err.message;
    if (action) action.innerHTML = `<i class="fa-solid fa-circle-xmark prog-error-icon"></i>`;
    toast(err.message.includes('401') ? '请先登录后再上传' : err.message, 'error');
  }
}

// ── 加载图片列表 ──────────────────────────────────────────────────────────
async function loadImages() {
  if (!authToken) {
    document.getElementById('image-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <i class="fa-regular fa-lock"></i>
      <div>请先登录后查看图片</div>
      <button class="btn-upload" style="margin-top:12px;" onclick="showAuthModal()">
        <i class="fa-regular fa-circle-user"></i> 登录
      </button>
    </div>`;
    document.getElementById('img-count').textContent = '0';
    return;
  }
  const grid = document.getElementById('image-grid');
  const count = document.getElementById('img-count');
  grid.innerHTML = `<div style="color:var(--sub);font-size:14px;padding:20px 0;grid-column:1/-1;display:flex;align-items:center;gap:8px;">
    <i class="fa-solid fa-circle-notch loading-spin"></i> 加载中…
  </div>`;
  try {
    const res = await fetch('/api/images', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    if (res.status === 401) {
      saveAuth(null, '');
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <i class="fa-regular fa-lock"></i>
        <div>登录已过期，请重新登录</div>
        <button class="btn-upload" style="margin-top:12px;" onclick="showAuthModal()">
          <i class="fa-regular fa-circle-user"></i> 登录
        </button>
      </div>`;
      return;
    }
    if (res.status === 403) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <i class="fa-solid fa-shield-halved"></i>
        <div>仅管理员可查看图片</div>
      </div>`;
      return;
    }
    const data = await res.json();
    const imgs = data.images || [];
    count.textContent = imgs.length;
    if (!imgs.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <i class="fa-regular fa-image"></i>
        <div>还没有上传任何图片</div>
      </div>`;
      return;
    }
    grid.innerHTML = imgs.map(img => `
      <div class="img-card" onclick="openModal(${JSON.stringify(img).replace(/"/g,'&quot;')})">
        <img src="${getProxyUrl(img.url)}" alt="${img.filename}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23eee%22 width=%22100%22 height=%22100%22/></svg>'"/>
        <div class="img-overlay">
          <button class="overlay-btn" onclick="event.stopPropagation();copyText(getLink({url:'${img.url}',filename:'${img.filename}'},copyFormat))">
            <i class="fa-solid fa-copy"></i> 复制
          </button>
          <button class="overlay-btn overlay-del" onclick="event.stopPropagation();deleteImage('${img.filename}')">
            <i class="fa-regular fa-trash-can"></i> 删除
          </button>
        </div>
        <div class="img-card-info">
          <span class="img-name">${img.filename}</span>
        </div>
      </div>
    `).join('');
  } catch (e) {
    grid.innerHTML = `<div style="color:#ff3b30;grid-column:1/-1;padding:20px">加载失败: ${e.message}</div>`;
  }
}

// ── 删除 ──────────────────────────────────────────────────────────────────
async function deleteImage(filename) {
  if (!confirm(`确认删除 ${filename}？`)) return;
  try {
    const res = await fetch(`/api/images/${encodeURIComponent(filename)}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + authToken } });
    if (!res.ok) { const d = await res.json(); throw new Error(d.detail); }
    toast('已删除');
    loadImages();
  } catch (e) { toast(e.message, 'error'); }
}

// ── 弹窗 ──────────────────────────────────────────────────────────────────
function openModal(img) {
  modalData = img;
  document.getElementById('modal-img').src  = getProxyUrl(img.url);
  document.getElementById('modal-title').textContent = img.filename;
  updateModalUrl();
  const m = document.getElementById('modal');
  m.style.display = 'flex';
  requestAnimationFrame(() => m.classList.add('show'));
}
function closeModal(e) {
  if (e && !e.target.id === 'modal' && e.target.closest('#modal-inner')) return;
  if (e && e.target.closest('#modal-inner') && e.target.id !== 'modal') return;
  const m = document.getElementById('modal');
  m.classList.remove('show');
  setTimeout(() => m.style.display = 'none', 200);
}
function updateModalUrl() {
  if (!modalData) return;
  document.getElementById('modal-url').textContent = getLink(modalData, modalFmt);
}
function copyModalUrl() { copyText(getLink(modalData, modalFmt)); }

document.getElementById('modal-fmt-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.fmt-tab');
  if (!btn) return;
  document.querySelectorAll('#modal-fmt-tabs .fmt-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  modalFmt = btn.dataset.fmt;
  updateModalUrl();
});

// ── 认证 ──────────────────────────────────────────────────────────────────
let authToken = (() => { try { return localStorage.getItem('deepnovis_token') } catch { return null } })()
let currentUser = (() => { try { return localStorage.getItem('deepnovis_user') || '' } catch { return '' } })()
let isAdmin = (() => { try { return localStorage.getItem('deepnovis_admin') === 'true' } catch { return false } })()

function saveAuth(token, username, admin = false) {
  authToken = token; currentUser = username; isAdmin = admin
  if (token) {
    try {
      localStorage.setItem('deepnovis_token', token);
      localStorage.setItem('deepnovis_user', username);
      localStorage.setItem('deepnovis_admin', admin ? 'true' : 'false');
    } catch {}
  } else {
    try {
      localStorage.removeItem('deepnovis_token');
      localStorage.removeItem('deepnovis_user');
      localStorage.removeItem('deepnovis_admin');
    } catch {}
  }
  renderAuthUI()
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._t); t._t = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(80px)' }, 2000);
}

function hideAuthModal() { document.getElementById('authModal').classList.remove('show') }
function showAuthModal() {
  document.getElementById('authModal').classList.add('show');
  document.getElementById('authError').classList.remove('show'); document.getElementById('authError').textContent = '';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginEmail').focus();
}
function renderAuthUI() {
  const headerLoginBtn = document.getElementById('headerLoginBtn'); const userArea = document.getElementById('userArea');
  const dropZone = document.getElementById('drop-zone');
  if (authToken && currentUser) {
    headerLoginBtn.style.display = 'none'; userArea.style.display = 'block';
    document.getElementById('userAvatar').textContent = currentUser.charAt(0).toUpperCase();
    document.getElementById('userName').textContent = currentUser + (isAdmin ? ' · 管理' : '');
    document.getElementById('menuUserName').textContent = currentUser + (isAdmin ? ' (管理员)' : '');
    dropZone.style.display = isAdmin ? '' : 'none';
  } else {
    headerLoginBtn.style.display = ''; userArea.style.display = 'none';
    dropZone.style.display = 'none';
  }
}

// ── Auth Modal 切换 ──
document.getElementById('authTabLogin')?.addEventListener('click', () => {
  document.getElementById('authTabLogin').className = 'auth-tab active';
  document.getElementById('authTabLogin').style.cssText = 'flex:1;padding:7px 0;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.1);';
  document.getElementById('authTabRegister').style.cssText = 'flex:1;padding:7px 0;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:var(--sub);';
  document.getElementById('loginForm').style.display = '';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('authError').classList.remove('show');
});
document.getElementById('authTabRegister')?.addEventListener('click', () => {
  document.getElementById('authTabRegister').className = 'auth-tab active';
  document.getElementById('authTabRegister').style.cssText = 'flex:1;padding:7px 0;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.1);';
  document.getElementById('authTabLogin').style.cssText = 'flex:1;padding:7px 0;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:var(--sub);';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = '';
  document.getElementById('regEmail').value = '';
  document.getElementById('regCode').value = '';
  document.getElementById('regPassword').value = '';
  document.getElementById('regEmail').focus();
  document.getElementById('authError').classList.remove('show');
});

// ── 登录 ──
document.getElementById('headerLoginBtn')?.addEventListener('click', () => showAuthModal());
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('authError');
  if (!email || !email.includes('@')) { errEl.textContent = '请输入有效的邮箱地址'; errEl.classList.add('show'); return; }
  if (!password) { errEl.textContent = '请输入密码'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('loginBtn'); const btnText = document.getElementById('loginBtnText');
  btn.disabled = true; btnText.textContent = '登录中…';
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password}) });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.detail || '登录失败'; errEl.classList.add('show'); btn.disabled = false; btnText.textContent = '登录'; return; }
    saveAuth(d.token, d.username, d.is_admin);
    hideAuthModal();
    showToast('登录成功');
    loadImages();
  } catch(e) { errEl.textContent = '网络错误: ' + e.message; errEl.classList.add('show'); }
  btn.disabled = false; btnText.textContent = '登录';
}
document.getElementById('loginBtn')?.addEventListener('click', doLogin);

// ── 注册 ──
document.getElementById('regSendCodeBtn')?.addEventListener('click', async function() {
  const email = document.getElementById('regEmail').value.trim();
  const errEl = document.getElementById('authError');
  if (!email || !email.includes('@')) { errEl.textContent = '请输入有效的邮箱地址'; errEl.classList.add('show'); return; }
  this.disabled = true; this.textContent = '发送中…';
  try {
    const r = await fetch('/api/auth/send-code', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '发送失败');
    showToast('验证码已发送');
    let sec = 60;
    this.textContent = `重新发送(${sec}s)`;
    const btn = this;
    const iv = setInterval(() => { sec--; if (sec<=0) { clearInterval(iv); btn.textContent='重新发送'; btn.disabled=false; return; } btn.textContent=`重新发送(${sec}s)`; }, 1000);
  } catch(e) { errEl.textContent = e.message; errEl.classList.add('show'); this.disabled = false; this.textContent = '获取验证码'; }
});
document.getElementById('registerBtn')?.addEventListener('click', async function() {
  const email = document.getElementById('regEmail').value.trim();
  const code = document.getElementById('regCode').value.trim();
  const password = document.getElementById('regPassword').value;
  const errEl = document.getElementById('authError');
  if (!email || !email.includes('@')) { errEl.textContent = '请输入有效的邮箱地址'; errEl.classList.add('show'); return; }
  if (!code || code.length !== 8) { errEl.textContent = '请输入 8 位验证码'; errEl.classList.add('show'); return; }
  if (!password || password.length < 8) { errEl.textContent = '密码至少 8 位'; errEl.classList.add('show'); return; }
  const btn = this; const btnText = document.getElementById('registerBtnText');
  btn.disabled = true; btnText.textContent = '注册中…';
  try {
    const r = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, code, password}) });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.detail || '注册失败'; errEl.classList.add('show'); btn.disabled = false; btnText.textContent = '注册'; return; }
    saveAuth(d.token, d.username, d.is_admin);
    hideAuthModal();
    showToast('注册成功');
    loadImages();
  } catch(e) { errEl.textContent = '网络错误: ' + e.message; errEl.classList.add('show'); }
  btn.disabled = false; btnText.textContent = '注册';
});

// Enter 键支持
document.getElementById('loginPassword')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('regPassword')?.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('registerBtn').click(); });
document.getElementById('authModal')?.addEventListener('click', (e) => { if (e.target === e.currentTarget) hideAuthModal() });
document.getElementById('userBtn')?.addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('userMenu').classList.toggle('show') });
document.addEventListener('click', () => document.getElementById('userMenu')?.classList.remove('show'));
document.getElementById('logoutBtn')?.addEventListener('click', () => { saveAuth(null, ''); document.getElementById('userMenu')?.classList.remove('show'); showToast('已退出登录'); });

// ── API 设置 ──
document.getElementById('apiSettingsBtn')?.addEventListener('click', () => {
  document.getElementById('userMenu')?.classList.remove('show');
  document.getElementById('apiSettingsError')?.classList.remove('show');
  document.getElementById('apiKeyInput').value = '';
  document.getElementById('apiSettingsModal').classList.add('show');
});
document.getElementById('apiSettingsCancelBtn')?.addEventListener('click', () => document.getElementById('apiSettingsModal').classList.remove('show'));
document.getElementById('apiSettingsModal')?.addEventListener('click', (e) => { if (e.target === e.currentTarget) document.getElementById('apiSettingsModal').classList.remove('show') });
document.getElementById('apiSettingsSaveBtn')?.addEventListener('click', async () => {
  const key = document.getElementById('apiKeyInput').value.trim();
  const errEl = document.getElementById('apiSettingsError');
  if (!key) { errEl.textContent = '请输入 API Key'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('apiSettingsSaveBtn'); const btnText = document.getElementById('apiSettingsSaveText');
  btn.disabled = true; btnText.textContent = '保存中…';
  try {
    const r = await fetch('/api/auth/settings', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ gpt_api_key: key })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '保存失败');
    document.getElementById('apiSettingsModal').classList.remove('show');
    showToast('API Key 已保存');
  } catch(e) { errEl.textContent = e.message; errEl.classList.add('show'); }
  btn.disabled = false; btnText.textContent = '保存';
});

// ── 初始化 ────────────────────────────────────────────────────────────────
loadImages();
renderAuthUI();
</script>

<div style="text-align:center;padding:20px 0 32px;font-size:12px;color:var(--sub);">
  v1.0.0
</div>

</body>
